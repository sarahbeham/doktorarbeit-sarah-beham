apply plugin: 'com.android.application'

// Study-specific configuration is kept out of version control.
// Copy local.properties.example to local.properties and fill in the values,
// or provide them as environment variables (useful for CI).
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def studyProperty = { String name, String env ->
    localProps.getProperty(name) ?: System.getenv(env) ?: ''
}

def uploadAddress = studyProperty('uploadAddress', 'SLC_UPLOAD_ADDRESS')
def participantKey = studyProperty('participantKey', 'SLC_PARTICIPANT_KEY')
def participantHash = studyProperty('participantHash', 'SLC_PARTICIPANT_HASH')

android {
    compileSdkVersion 34
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    defaultConfig {
        applicationId "com.doktorarbeitbeham"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName "1.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "UPLOAD_ADDRESS", "\"${uploadAddress}\""
        buildConfigField "String", "PARTICIPANT_KEY", "\"${participantKey}\""
        buildConfigField "String", "PARTICIPANT_HASH", "\"${participantHash}\""
    }

    namespace 'com.doktorarbeitbeham'

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation 'androidx.work:work-runtime:2.9.0'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // TODO: if camera fucks up, go back change this to 1.0.0-beta07
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    // implementation "androidx.camera:camera-view:1.0.0-alpha14"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.zxing:core:3.5.1'
    def work_version = "2.9.0"
    implementation "androidx.work:work-runtime:$work_version"
    implementation 'net.danlew:android.joda:2.10.12.2'
}
